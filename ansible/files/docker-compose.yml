      #Опция xpack отключает запрос пароля. В учебных целях иногда можно указать. Тогда пароль запрашиваться не будет
      #- xpack.security.enabled=false
      - discovery.type=single-node

        # logstash:
        #   image: logstash:9.1.2
        #   ports:
        #     - 5044:5044
