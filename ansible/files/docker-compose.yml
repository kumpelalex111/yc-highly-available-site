      #- ./logstash:/usr/share/logstash/config/
      #- /test/logstash/pipelines.yml:/usr/share/logstash/pipeline/pipelines.yml
      #- /test/logstash/nginx.conf:/usr/share/logstash/config/nginx.conf
        #environment:
    # Также отключает запрос пароля в logstash (только для учебы и только иногда)
    #  XPACK_MONITORING_ENABLED: "false"
     

  kibana:
    container_name: kibana
    image: kibana:9.1.2
