- name: "Install Docker, ElasticSearch и  Kibana"
  hosts: elastic
  become: yes
  vars_files:
    vars.yml
  tasks:
  # Установка Docker
  - name: install dependencies
    ansible.builtin.apt:
      name: "{{ item }}"
      state: present
      update_cache: yes
    loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg-agent
        - software-properties-common

  - name: add GPG key
    ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

  - name: add docker repository to apt
    ansible.builtin.apt_repository:
          repo: deb https://download.docker.com/linux/ubuntu noble stable
          state: present

  - name: install docker
    ansible.builtin.apt:
      name: "{{ item }}"
      state: latest
      update_cache: yes
    loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

  - name: check docker is active
    ansible.builtin.service:
      name: docker
      state: started
      enabled: yes

  - name: Ensure group "docker" exists
    ansible.builtin.group:
      name: docker
      state: present

  - name: adding ubuntu to docker group
    ansible.builtin.user:
      name: alex
      groups: docker
      append: yes

# Скачиваем и запускаем образы с Elasticsearch и Kibana
  
  - name: "copy file docker-compose"
    ansible.builtin.copy:
      src: ./files/docker-compose.yml
      dest: /test/
      owner: root
      group: root
      mode: "0644"


  - name: Create and start services
    community.docker.docker_compose_v2:
      project_src: /test/
      pull: missing
      state: present
      recreate: auto

  - name: Pause to launch Kibana and Elastic
    ansible.builtin.pause:
      seconds: 90
  
  - name: Reset password elastic
    ansible.builtin.expect:
      command: docker exec -it test-elasticsearch-1 /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic
      responses:
        "Please confirm that you would like to continue" : "y"
    register: elastic_passwd

  - name: Get a token
    ansible.builtin.command: docker exec -it test-elasticsearch-1 /usr/share/elasticsearch/bin/elasticsearch-create-enrollment-token -s kibana
    register: elastic_tocken

  - name: Verifying the Kibana launch
    ansible.builtin.uri:
      url: http://{{ kibana }}:5601
      timeout: 60

  - name: Get the Kibana verification code
    ansible.builtin.command: docker exec -it kibana /usr/share/kibana/bin/kibana-verification-code
    register: kibana_code

  - name: Display elastic_passwd
    ansible.builtin.debug:
      var: elastic_passwd

  - name: Display token
    ansible.builtin.debug:
      var: elastic_tocken

  - name: Display kode Kibana
    ansible.builtin.debug:
      var: kibana_code

